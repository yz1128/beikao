<div class="app">
  <header class="topbar">
    <button id="back-button" class="icon-btn" type="button" aria-label="返回科目目录" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

<dialog id="data-dialog" aria-labelledby="data-title">
  <div class="dialog-body">
    <h2 id="data-title">数据管理</h2>
    <p class="muted" id="data-note"></p>
    <div class="btn-row" style="margin-top:18px">
      <button class="btn btn-secondary" type="button" id="export-button">导出进度</button>
      <button class="btn btn-secondary" type="button" id="import-button">导入进度</button>
    </div>
    <label class="caption" for="data-field" style="display:block;margin-top:16px">备份文本（导入时粘贴到这里）</label>
    <textarea class="field" id="data-field" spellcheck="false" placeholder="导出后这段文本可复制保存"></textarea>
    <div class="dialog-actions">
      <button class="btn btn-quiet" type="button" id="data-close">关闭</button>
      <button class="btn btn-primary" type="button" id="data-apply">应用</button>
    </div>
    <p class="caption" id="data-status" aria-live="polite" style="margin-top:10px"></p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
